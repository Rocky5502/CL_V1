[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "epifair"
version = "0.1.0"
description = "Experiment infrastructure for Epistemic Behavioral Fairness in LLMs"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.5",
  "statsmodels>=0.14", "pyarrow>=17", "pyyaml>=6.0", "pydantic>=2.8",
  "typer>=0.12", "rich>=13.7", "tenacity>=8.5", "tqdm>=4.66",
  "orjson>=3.10", "matplotlib>=3.9"
]

[project.optional-dependencies]
data = ["huggingface-hub>=0.28", "datasets>=3.2"]
local = ["torch>=2.6", "transformers>=4.51", "accelerate>=1.2", "sentence-transformers>=3.3", "safetensors>=0.4"]
api = ["openai>=1.60", "anthropic>=0.45", "google-genai>=1.0"]
vllm = ["vllm>=0.12"]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.9", "mypy>=1.14", "types-PyYAML>=6.0"]

[project.scripts]
epifair = "epifair.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/epifair"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
